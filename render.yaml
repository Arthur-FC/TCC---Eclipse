services:
  - type: web
    name: tcc-eclipse
    runtime: node
    plan: free
    region: ohio
    healthCheckPath: /api/health
    buildCommand: npm ci && npm run build && cd backend && corepack pnpm install --frozen-lockfile && corepack pnpm build && corepack pnpm db:migration:run
    startCommand: cd backend && node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        value: us-east-2
      - key: STORAGE_BUCKET
        value: eclipse-audio
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_FORCE_PATH_STYLE
        value: "true"
      - key: EXTERNAL_BILLING_ALLOWED
        value: "false"
      - key: STEM_SEPARATOR_WORKER_ENABLED
        value: "false"
