<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eclipse</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Varela+Round&display=swap');*{box-sizing:border-box}body{margin:0;min-width:300px;min-height:100vh;background:linear-gradient(110deg,#272727,#303030);color:#fff;font-family:Inter,Arial}.app{display:flex;min-height:100vh;overflow:hidden}aside{z-index:2;width:218px;margin:10px 0 10px 25px;padding:10px 15px;background:#2b2b2b;border-radius:9px;box-shadow:0 0 7px #d569ff40}.brand{height:50px;display:flex;align-items:center;gap:10px;padding:5px 20px;border-radius:52px;font:22px 'Varela Round';box-shadow:0 0 7px #d569ff40}.bars{width:40px;height:34px;display:flex;gap:3px;align-items:end}.bars i{width:5px;border-radius:6px;background:linear-gradient(155deg,#f300d6,#5f87ff)}.bars i:nth-child(1){height:75%}.bars i:nth-child(2){height:56%}.bars i:nth-child(3){height:100%}.bars i:nth-child(4){height:48%}.bars i:nth-child(5){height:66%}.tools{display:grid;gap:15px;margin-top:44px}.tools button,.tools label,.chat{width:188px;height:34px;border:0;border-radius:45px;background:#383838;box-shadow:0 4px 4px #0004;color:#fff;font:600 13px Inter}.tools button{padding:0 12px;text-align:left}.accent{color:#ae40ff;font-size:19px;margin-right:8px}.tools label{display:flex;align-items:center;padding:0 10px}.tools input{width:100%;border:0;outline:0;background:transparent;color:#fff}section{margin-top:43px;color:#696969}h2{margin:0;font-size:13px;font-weight:500}small{display:block;margin:18px 0 10px;font-size:10px}.chat{display:block;margin-bottom:20px;padding:0 12px;overflow:hidden;text-align:left;text-overflow:ellipsis;white-space:nowrap;font-weight:400}.main{position:relative;display:grid;place-items:center;flex:1;isolation:isolate}.hero{z-index:1;width:min(805px,calc(100vw - 330px));margin-top:-15px}.logo{display:flex;align-items:center;justify-content:center;gap:28px;margin-bottom:50px;font:64px 'Varela Round'}.large{width:96px;height:83px;gap:8px}.large i{width:12px;border-radius:9px}.form{display:flex;align-items:center;height:60px;padding:0 15px 0 33px;border-radius:48px;background:#4c4c4c;box-shadow:0 4px 4px 3px #0004}.form input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;font:18px 'Varela Round'}.form button{border:0;background:transparent;color:#b13bfb;font-size:34px}.ring{position:absolute;z-index:-1;width:860px;height:702px;border:11px solid #3b3b3b;border-radius:50%;opacity:.8}.top{top:-585px;right:-340px}.bottom{bottom:-596px;left:63px}@media(max-width:980px){aside{margin-left:12px}.hero{width:min(620px,calc(100vw - 260px))}.logo{font-size:52px}.ring{opacity:.5}}@media(max-width:720px){.app{display:block;overflow:auto}aside{display:flex;align-items:center;gap:14px;width:100%;min-height:74px;margin:0;padding:12px 16px;border-radius:0}.brand{width:auto;min-width:155px}.tools{display:flex;flex:1;gap:8px;margin:0}.tools button,.tools label{width:auto;min-width:0;flex:1}aside section{display:none}.main{min-height:calc(100vh - 74px)}.hero{width:min(90vw,560px);margin-top:-30px}.logo{gap:8px;margin-bottom:32px;font-size:clamp(40px,11vw,54px)}.large{transform:scale(.72);transform-origin:right center;margin-right:-20px}.form{height:56px;padding-left:20px}.top{right:-650px}.bottom{left:-390px}}@media(max-width:480px){aside{align-items:flex-start;flex-wrap:wrap}.brand{height:42px;padding:4px 12px;font-size:20px}.tools{width:100%;flex-basis:100%}.main{min-height:calc(100vh - 132px)}.hero{width:92vw}.logo{font-size:40px}.form{padding-left:16px}.form input{font-size:16px}}</style></head><body><main class="app"><aside><div class="brand"><span class="bars"><i></i><i></i><i></i><i></i><i></i></span>Eclipse</div><div class="tools"><button id="new"><span class="accent">+</span>Novo Chat</button><label><span class="accent">⌕</span><input id="filter" placeholder="Procurar"></label></div><section><h2>Seu histórico⌄</h2><div id="history"></div></section></aside><div class="main"><div class="ring top"></div><div class="ring bottom"></div><div class="hero"><div class="logo"><span class="bars large"><i></i><i></i><i></i><i></i><i></i></span>Eclipse</div><form class="form" id="form"><input id="message" placeholder="Digite Aqui:"><button>➤</button></form></div></div></main><script>const c=[['Hoje','Ajuda na organização...'],['Hoje','Escolha do Instrumento...'],['Ontem','Separação da Playlist...']],h=document.querySelector('#history'),f=document.querySelector('#filter');function draw(){h.innerHTML='';['Hoje','Ontem'].forEach(d=>{let a=c.filter(x=>x[0]==d&&x[1].toLowerCase().includes(f.value.toLowerCase()));if(a.length){h.insertAdjacentHTML('beforeend','<small>'+d+'</small>');a.forEach(x=>h.insertAdjacentHTML('beforeend','<button class="chat">'+x[1]+'</button>'))}})}f.oninput=draw;new.onclick=()=>{c.unshift(['Hoje','Nova conversa']);draw()};form.onsubmit=e=>{e.preventDefault();if(message.value.trim()){c.unshift(['Hoje',message.value.trim()]);message.value='';draw()}};draw()</script></body></html>
