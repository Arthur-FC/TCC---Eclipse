<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eclipse</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Varela+Round&display=swap');*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;background:linear-gradient(105deg,#272727 8%,#303030);color:#fff;font-family:Inter,Arial}.shell{display:flex;min-height:100vh;overflow:hidden}aside{z-index:2;flex:0 0 218px;margin:10px 0 10px 25px;padding:10px 15px;background:#2b2b2b;border-radius:9px;box-shadow:0 0 7px #d569ff40}.small-logo{height:50px;width:168px;display:flex;align-items:center;gap:10px;padding:5px 20px;border-radius:52px;font:22px 'Varela Round';box-shadow:0 0 7px #d569ff40}.bars{width:40px;height:34px;display:inline-flex;gap:3px;align-items:end}.bars i{width:5px;border-radius:6px;background:linear-gradient(155deg,#f300d6,#5f87ff)}.bars i:nth-child(1){height:75%}.bars i:nth-child(2){height:56%}.bars i:nth-child(3){height:100%}.bars i:nth-child(4){height:48%}.bars i:nth-child(5){height:66%}.actions{display:grid;gap:15px;margin-top:44px}.actions button,.actions label,aside section button{width:188px;height:34px;border:0;border-radius:45px;background:#383838;box-shadow:0 4px 4px #0004;color:#fff;font:600 13px Inter}.actions button{text-align:left;padding:0 12px;cursor:pointer}.actions button b,.actions label span{color:#ae40ff;font-size:19px;margin-right:8px}.actions label{display:flex;align-items:center;padding:0 10px}.actions input{width:100%;background:transparent;border:0;outline:0;color:#fff;font:600 13px Inter}.actions input::placeholder{color:#fff}aside section{margin-top:43px;color:#696969}h2{margin:0;font-size:13px;font-weight:500}small{display:block;margin:18px 0 10px;font-size:10px}aside section button{display:block;margin-bottom:20px;padding:0 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;font-weight:400}.content{position:relative;display:grid;place-items:center;flex:1;isolation:isolate}.hero{z-index:1;width:min(805px,calc(100vw - 330px));margin-top:-15px}.logo{display:flex;align-items:center;justify-content:center;gap:28px;margin-bottom:50px;font:64px 'Varela Round'}.big{width:96px;height:83px;gap:8px}.big i{width:12px;border-radius:9px}.form{display:flex;align-items:center;height:60px;padding-left:33px;padding-right:15px;border-radius:48px;background:#4c4c4c;box-shadow:0 4px 4px 3px #0004}.form input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;font:18px 'Varela Round'}.form input::placeholder{color:#aaa}.form button{border:0;background:transparent;color:#b13bfb;font-size:34px;cursor:pointer}.ring{position:absolute;z-index:-1;width:860px;height:702px;border:11px solid #3b3b3b;border-radius:50%}.top{top:-585px;right:-340px;transform:rotate(45deg)}.bottom{left:63px;bottom:-596px;transform:rotate(135deg)}@media(max-width:720px){.shell{display:block}aside{margin:0;width:100%;min-height:auto}.content{min-height:calc(100vh - 145px)}.hero{width:88vw}.logo{font-size:46px;gap:8px}.big{transform:scale(.7);margin-right:-20px}aside section{display:none}}</style></head><body><main class="shell"><aside><div class="small-logo"><span class="bars"><i></i><i></i><i></i><i></i><i></i></span>Eclipse</div><div class="actions"><button id="new"><b>+</b>Novo Chat</button><label><span>⌕</span><input id="filter" placeholder="Procurar"></label></div><section><h2>Seu histórico⌄</h2><div id="history"></div></section></aside><section class="content"><div class="ring top"></div><div class="ring bottom"></div><div class="hero"><div class="logo"><span class="bars big"><i></i><i></i><i></i><i></i><i></i></span>Eclipse</div><form class="form" id="form"><input id="message" placeholder="Digite Aqui:"><button>➤</button></form></div></section></main><script>const chats=[['Hoje','Ajuda na organização...'],['Hoje','Escolha do Instrumento...'],['Ontem','Separação da Playlist...']],hist=document.querySelector('#history'),filter=document.querySelector('#filter');function draw(){hist.innerHTML='';['Hoje','Ontem'].forEach(d=>{const a=chats.filter(c=>c[0]===d&&c[1].toLowerCase().includes(filter.value.toLowerCase()));if(a.length){const s=document.createElement('small');s.textContent=d;hist.append(s);a.forEach(c=>{const b=document.createElement('button');b.textContent=c[1];hist.append(b)})}})}filter.oninput=draw;document.querySelector('#new').onclick=()=>{chats.unshift(['Hoje','Nova conversa']);filter.value='';draw()};document.querySelector('#form').onsubmit=e=>{e.preventDefault();const m=document.querySelector('#message');if(m.value.trim()){chats.unshift(['Hoje',m.value.trim()]);m.value='';filter.value='';draw()}};draw()</script></body></html>
