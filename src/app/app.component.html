<ion-app>
    <main *ngIf="isInitializing" class="loading-screen" aria-live="polite">
        <div class="loading-logo">Eclipse</div>
        <p>Carregando sua sessão...</p>
    </main>

    <app-auth-screen
        *ngIf="!isInitializing && !user"
        [loading]="isAuthenticating"
        [errorMessage]="authErrorMessage"
        (authenticationRequested)="authenticate($event)"
    ></app-auth-screen>

    <main *ngIf="!isInitializing && user" class="shell">
        <div *ngIf="errorMessage" class="status-banner" role="alert">
            <span>{{ errorMessage }}</span>
            <button type="button" aria-label="Fechar aviso" (click)="errorMessage = ''">&times;</button>
        </div>

        <div *ngIf="isLoadingChats" class="loading-overlay" aria-live="polite">
            Carregando projetos...
        </div>

        <app-sidebar
            [chats]="chats"
            [selectedChatId]="selectedChat?.id ?? null"
            [userName]="user.name"
            [busy]="operationInProgress || isSending"
            [(filter)]="filter"
            (newChat)="startNewChat()"
            (homeRequested)="goHome()"
            (logoutRequested)="logout()"
            (chatSelected)="selectChat($event)"
            (chatDeleted)="deleteChat($event)"
            (chatRenamed)="renameChat($event)"
        ></app-sidebar>

        <app-chat-window
            [chat]="selectedChat"
            [sending]="isSending"
            [messageResetToken]="messageResetToken"
            [retryAvailable]="failedReplyChatId === selectedChat?.id"
            [briefing]="briefing"
            [briefingBusy]="isBriefingBusy"
            [briefingError]="briefingErrorMessage"
            [references]="references"
            [referencesBusy]="isReferencesBusy"
            [referencesError]="referencesErrorMessage"
            [referenceSearchQuery]="referenceSearchQuery"
            [referencesFromCache]="referencesFromCache"
            (closeRequested)="goHome()"
            (messageSent)="sendMessage($event)"
            (retryRequested)="retryAssistant()"
            (briefingRequested)="loadBriefing()"
            (briefingGenerateRequested)="generateBriefing()"
            (briefingSaveRequested)="saveBriefing($event)"
            (briefingConfirmRequested)="confirmBriefing()"
            (referencesRequested)="loadReferences()"
            (referencesSearchRequested)="searchYouTubeReferences($event)"
            (referenceStatusChanged)="updateReferenceStatus($event)"
        ></app-chat-window>
    </main>
</ion-app>
