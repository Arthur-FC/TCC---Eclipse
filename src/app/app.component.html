<ion-app>
    <main class="shell">
        <app-sidebar
            [chats]="chats"
            [selectedChatId]="selectedChat?.id ?? null"
            [(filter)]="filter"
            (newChat)="startNewChat()"
            (chatSelected)="selectChat($event)"
        ></app-sidebar>

        <app-chat-window
            [chat]="selectedChat"
            (messageSent)="sendMessage($event)"
        ></app-chat-window>
    </main>
</ion-app>
