<div class="ring top" aria-hidden="true"></div>
<div class="ring bottom" aria-hidden="true"></div>

<section *ngIf="chat; else welcome" class="conversation" aria-live="polite">
    <header>
        <h1>{{ chat.title }}</h1>
        <button
            *ngIf="chat.conversationId"
            type="button"
            class="panel-button"
            [class.active]="briefingOpen"
            (click)="toggleBriefing()"
        >
            {{ briefingOpen ? 'Voltar ao chat' : 'Briefing' }}
        </button>
        <button
            *ngIf="chat.conversationId"
            type="button"
            class="panel-button"
            [class.active]="libraryOpen"
            (click)="toggleLibrary()"
        >
            {{ libraryOpen ? 'Voltar ao chat' : 'Biblioteca' }}
        </button>
        <button
            *ngIf="chat.conversationId"
            type="button"
            class="panel-button references-button"
            [class.active]="referencesOpen"
            (click)="toggleReferences()"
        >
            {{ referencesOpen ? 'Voltar ao chat' : 'Referências' }}
        </button>
        <button
            type="button"
            class="close-button"
            aria-label="Fechar conversa"
            title="Fechar conversa"
            (click)="closeRequested.emit()"
        >
            &times;
        </button>
    </header>

    <app-briefing-panel
        *ngIf="briefingOpen"
        [briefing]="briefing"
        [busy]="briefingBusy"
        [errorMessage]="briefingError"
        [canGenerate]="!!chat.conversationId && chat.messages.length > 0"
        (generateRequested)="briefingGenerateRequested.emit()"
        (saveRequested)="briefingSaveRequested.emit($event)"
        (confirmRequested)="briefingConfirmRequested.emit()"
    ></app-briefing-panel>

    <app-references-panel
        *ngIf="referencesOpen"
        [references]="references"
        [busy]="referencesBusy"
        [errorMessage]="referencesError"
        [searchQuery]="referenceSearchQuery"
        [fromCache]="referencesFromCache"
        (searchRequested)="referencesSearchRequested.emit($event)"
        (spotifyAddRequested)="spotifyReferenceAddRequested.emit($event)"
        (statusChanged)="referenceStatusChanged.emit($event)"
    ></app-references-panel>

    <app-library-panel
        *ngIf="libraryOpen"
        [tracks]="libraryTracks"
        [busy]="libraryBusy"
        [errorMessage]="libraryError"
        [playbackTrackId]="libraryPlaybackTrackId"
        [playbackUrl]="libraryPlaybackUrl"
        (uploadRequested)="libraryUploadRequested.emit($event)"
        (playbackRequested)="libraryPlaybackRequested.emit($event)"
        (playbackStopped)="libraryPlaybackStopped.emit()"
        (reprocessRequested)="libraryReprocessRequested.emit($event)"
        (deleteRequested)="libraryDeleteRequested.emit($event)"
    ></app-library-panel>

    <div *ngIf="!briefingOpen && !referencesOpen && !libraryOpen" #messages class="messages">
        <app-message
            *ngFor="let message of chat.messages"
            [message]="message"
        ></app-message>

        <div
            *ngIf="showTypingIndicator"
            class="typing-indicator"
            role="status"
            aria-label="Eclipse está escrevendo"
        >
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
        </div>

        <p *ngIf="chat.messages.length === 0 && !showTypingIndicator" class="empty-state">
            Esta conversa ainda não possui mensagens.
        </p>
    </div>

    <div *ngIf="!briefingOpen && !referencesOpen && !libraryOpen" class="composer-area">
        <button
            *ngIf="retryAvailable"
            type="button"
            class="retry-button"
            [disabled]="sending"
            (click)="retryRequested.emit()"
        >
            Tentar gerar a resposta novamente
        </button>
        <app-message-input
            [disabled]="sending"
            [resetToken]="messageResetToken"
            (messageSent)="messageSent.emit($event)"
        ></app-message-input>
    </div>
</section>

<ng-template #welcome>
    <section class="hero">
        <div class="logo">
            <span class="bars big" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
            Eclipse
        </div>
        <app-message-input
            [disabled]="sending"
            [resetToken]="messageResetToken"
            (messageSent)="messageSent.emit($event)"
        ></app-message-input>
    </section>
</ng-template>
