<aside>
    <button
        type="button"
        class="small-logo"
        aria-label="Voltar para a página inicial"
        (click)="requestHome()"
    >
        <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        Eclipse
    </button>

    <button
        type="button"
        class="mobile-history-toggle"
        aria-controls="mobile-history-panel"
        [attr.aria-expanded]="mobileHistoryOpen"
        [attr.aria-label]="mobileHistoryOpen ? 'Fechar histórico' : 'Abrir histórico'"
        (click)="toggleMobileHistory()"
    >
        <ion-icon [name]="mobileHistoryOpen ? 'close' : 'menu'" aria-hidden="true"></ion-icon>
    </button>

    <div class="actions">
        <ion-button [disabled]="busy" (click)="requestNewChat()" fill="clear">
            <ion-icon name="add" aria-hidden="true"></ion-icon>
            Novo Chat
        </ion-button>

        <label>
            <span class="visually-hidden">Procurar conversas</span>
            <ion-icon name="search" aria-hidden="true"></ion-icon>
            <input
                [ngModel]="filter"
                (ngModelChange)="filterChange.emit($event)"
                placeholder="Procurar"
            >
        </label>
    </div>

    <app-chat-list
        id="mobile-history-panel"
        [class.mobile-open]="mobileHistoryOpen"
        [chats]="chats"
        [filter]="filter"
        (filterChange)="filterChange.emit($event)"
        (newChatRequested)="requestNewChat()"
        [selectedChatId]="selectedChatId"
        [busy]="busy"
        (chatSelected)="selectChat($event)"
        (chatDeleted)="chatDeleted.emit($event)"
        (chatRenamed)="chatRenamed.emit($event)"
    ></app-chat-list>

    <div class="account">
        <span [title]="userName">{{ userName }}</span>
        <button type="button" [disabled]="busy" (click)="logoutRequested.emit()">Sair</button>
    </div>
</aside>

<button
    *ngIf="mobileHistoryOpen"
    type="button"
    class="history-backdrop"
    aria-label="Fechar histórico"
    (click)="closeMobileHistory()"
></button>
