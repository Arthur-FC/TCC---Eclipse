services:
  postgres:
    image: postgres:17-alpine
    container_name: eclipse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eclipse
      POSTGRES_USER: eclipse
      POSTGRES_PASSWORD: eclipse_dev
    ports:
      - "5432:5432"
    volumes:
      - eclipse_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eclipse -d eclipse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  eclipse_postgres_data:
