services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    container_name: eclipse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-eclipse}
      POSTGRES_USER: ${DATABASE_USER:-eclipse}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Defina DATABASE_PASSWORD no arquivo backend/.env}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      - eclipse_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-eclipse} -d ${DATABASE_NAME:-eclipse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: eclipse-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:?Defina STORAGE_ACCESS_KEY no arquivo backend/.env}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?Defina STORAGE_SECRET_KEY no arquivo backend/.env}
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:4200,http://127.0.0.1:4200"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - eclipse_minio_data:/data

volumes:
  eclipse_postgres_data:
  eclipse_minio_data:
